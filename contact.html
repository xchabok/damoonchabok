<h1>Contact</h1>

<p class="subtitle">
If you want to reach me, send a message below or use email.
</p>

<div class="card">

    <label>Name</label><br>

    <label>Message</label><br>
    <textarea name="message" rows="6" required></textarea><br><br>

    <button type="submit">Send</button>

  </form>

</div>
